<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>BudgetVault — Login</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Inter, Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      background: #f7f9fc;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #111827;
      padding: 20px;
    }

    .page {
      width: 100%;
      max-width: 480px;
    }

    .card {
      background: white;
      border-radius: 24px;
      padding: 40px;
      box-shadow: 0 18px 50px rgba(0, 0, 0, 0.08);
    }

    .logo {
      text-align: center;
      font-size: 26px;
      font-weight: 800;
      color: #16a34a;
      margin-bottom: 35px;
    }

    .back {
      display: inline-block;
      color: #6b7280;
      font-size: 14px;
      text-decoration: none;
      margin-bottom: 28px;
    }

    .back:hover {
      color: #16a34a;
    }

    h1 {
      font-size: 30px;
      margin-bottom: 10px;
    }

    .subtitle {
      color: #6b7280;
      line-height: 1.6;
      margin-bottom: 28px;
    }

    .form-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 8px;
    }

    .input-wrapper {
      position: relative;
    }

    input {
      width: 100%;
      padding: 15px;
      border: 1px solid #d1d5db;
      border-radius: 12px;
      font-size: 16px;
      outline: none;
      transition: 0.2s;
    }

    input:focus {
      border-color: #16a34a;
      box-shadow: 0 0 0 3px rgba(22, 163, 74, 0.1);
    }

    .password-toggle {
      position: absolute;
      right: 14px;
      top: 50%;
      transform: translateY(-50%);
      border: none;
      background: transparent;
      cursor: pointer;
      color: #6b7280;
      font-size: 14px;
    }

    .forgot {
      display: block;
      text-align: right;
      margin-top: -8px;
      margin-bottom: 22px;
      color: #16a34a;
      text-decoration: none;
      font-size: 14px;
      font-weight: 600;
    }

    .forgot:hover {
      text-decoration: underline;
    }

    .login-btn {
      width: 100%;
      border: none;
      padding: 16px;
      border-radius: 12px;
      background: #16a34a;
      color: white;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      transition: 0.2s;
    }

    .login-btn:hover {
      background: #15803d;
      transform: translateY(-1px);
    }

    .divider {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 28px 0;
      color: #9ca3af;
      font-size: 13px;
    }

    .divider::before,
    .divider::after {
      content: "";
      flex: 1;
      height: 1px;
      background: #e5e7eb;
    }

    .signup-text {
      text-align: center;
      color: #6b7280;
      font-size: 14px;
    }

    .signup-text a {
      color: #16a34a;
      font-weight: 700;
      text-decoration: none;
    }

    .signup-text a:hover {
      text-decoration: underline;
    }

    .message {
      display: none;
      margin-top: 18px;
      padding: 13px;
      border-radius: 10px;
      font-size: 14px;
      text-align: center;
    }

    .message.error {
      display: block;
      background: #fef2f2;
      color: #b91c1c;
    }

    .message.success {
      display: block;
      background: #f0fdf4;
      color: #166534;
    }

    @media (max-width: 600px) {

      .card {
        padding: 28px 20px;
        border-radius: 18px;
      }

      h1 {
        font-size: 26px;
      }
    }
  </style>
</head>

<body>

  <div class="page">

    <div class="card">

      <div class="logo">
        BudgetVault
      </div>

      <a href="landing.html" class="back">
        ← Back to home
      </a>

      <h1>Welcome back</h1>

      <p class="subtitle">
        Log in to continue managing your money with BudgetVault.
      </p>

      <form id="loginForm">

        <div class="form-group">

          <label for="email">
            Email address
          </label>

          <input
            type="email"
            id="email"
            placeholder="you@example.com"
            autocomplete="email"
            required
          >

        </div>


        <div class="form-group">

          <label for="password">
            Password
          </label>

          <div class="input-wrapper">

            <input
              type="password"
              id="password"
              placeholder="Enter your password"
              autocomplete="current-password"
              required
            >

            <button
              type="button"
              class="password-toggle"
              onclick="togglePassword()"
            >
              Show
            </button>

          </div>

        </div>


        <a href="#" class="forgot" onclick="forgotPassword(event)">
          Forgot password?
        </a>


        <button
          type="submit"
          class="login-btn"
        >
          Log in
        </button>

      </form>


      <div id="message" class="message"></div>


      <div class="divider">
        OR
      </div>


      <div class="signup-text">

        Don't have an account?

        <a href="signup01.html">
          Create one
        </a>

      </div>

    </div>

  </div>


  <script>

    /*
      PASSWORD VISIBILITY
    */

    function togglePassword() {

      const password =
        document.getElementById("password");

      const button =
        document.querySelector(".password-toggle");

      if (password.type === "password") {

        password.type = "text";

        button.textContent = "Hide";

      } else {

        password.type = "password";

        button.textContent = "Show";

      }

    }


    /*
      LOGIN DEMO
    */

    document
      .getElementById("loginForm")
      .addEventListener("submit", function(event) {

        event.preventDefault();

        const email =
          document.getElementById("email").value.trim();

        const password =
          document.getElementById("password").value.trim();

        const message =
          document.getElementById("message");


        if (!email || !password) {

          message.className = "message error";

          message.textContent =
            "Please enter your email and password.";

          return;
        }


        /*
          DEMO LOGIN

          This simulates a successful login.

          The real application can later replace
          this section with the actual authentication
          API/backend.
        */

        message.className = "message success";

        message.textContent =
          "Login successful. Welcome back!";


        setTimeout(function() {

          window.location.href = "index.html";

        }, 900);

      });


    /*
      FORGOT PASSWORD DEMO
    */

    function forgotPassword(event) {

      event.preventDefault();

      const email =
        document.getElementById("email").value.trim();

      const message =
        document.getElementById("message");


      if (!email) {

        message.className = "message error";

        message.textContent =
          "Enter your email address first.";

        document.getElementById("email").focus();

        return;
      }


      message.className = "message success";

      message.textContent =
        "Password reset instructions would be sent to your email.";

    }

  </script>

</body>
</html>
